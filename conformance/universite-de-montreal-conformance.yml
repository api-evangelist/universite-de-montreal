standards:
- standard: shibboleth
  status: conformant
  x-operator: institution
  evidence:
    url: https://shibboleth.umontreal.ca/idp/shibboleth
    status: 200
    contentType: application/xml
    detail: >-
      Live Shibboleth Identity Provider metadata under the institution's own registrable domain.
      The document declares shibmd:Scope "umontreal.ca" (twice, non-regexp), an mdui:DisplayName
      of "Université de Montréal" in fr and en, mdui:Description "UdeM - IdP", and a
      urn:mace:shibboleth:1.0:profiles:AuthnRequest SingleSignOnService binding at
      /idp/profile/Shibboleth/SSO. A second endpoint, https://shibboleth.umontreal.ca/idp/status,
      returns 200 text/plain with the running IdP's JVM and uptime report.
  note: >-
    Institution-operated by definition. This is the surface class the university pipeline calls
    out as almost never catalogued, and it was absent from this repo's June 2026 profile.
- standard: saml
  status: conformant
  x-operator: institution
  evidence:
    url: https://shibboleth.umontreal.ca/idp/shibboleth
    status: 200
    contentType: application/xml
    detail: >-
      SAML 2.0 EntityDescriptor, entityID https://shibboleth.umontreal.ca/idp/shibboleth,
      IDPSSODescriptor advertising protocolSupportEnumeration
      "urn:oasis:names:tc:SAML:2.0:protocol urn:oasis:names:tc:SAML:1.1:protocol urn:mace:shibboleth:1.0",
      plus an AttributeAuthorityDescriptor for SAML 1.1. Bindings observed: HTTP-POST,
      HTTP-POST-SimpleSign, HTTP-Redirect and SOAP for SSO/SLO, and SOAP ArtifactResolution on
      port 8443 for both SAML 1.0 and SAML 2.0.
- standard: oai-pmh
  status: conformant
  x-operator: tenant
  evidence:
    url: https://umontreal.scholaris.ca/server/oai/request?verb=ListMetadataFormats
    status: 200
    contentType: text/xml
    detail: >-
      OAI-PMH 2.0 repository for PAPYRUS, the UdeM institutional repository. Identify returns
      repositoryName "PAPYRUS - Dépôt institutionnel de l'Université de Montréal". The default
      context advertises 18 metadata prefixes — oai_dc, qdc, mods, marc, marc21, dim, ore, mets,
      didl, rdf, xoai, uketd_dc, etdms, etdms10, etdms11, oai_etdms, oai_openaire and
      oai_openaire4science. A second context at /server/oai/openaire4 answers Identify,
      ListMetadataFormats and ListSets and is restricted to oai_openaire against the OpenAIRE
      repo-lit 4.0 schema.
  note: >-
    UdeM's repository content and UdeM's subdomain, but the OAI-PMH implementation is DSpace's,
    delivered through Scholaris, the CRKN-hosted national DSpace service. Credit the institution
    for operating a harvestable repository; the protocol conformance belongs to DSpace.
