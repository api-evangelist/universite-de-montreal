description: >-
  Authorization scopes across Université de Montréal's programmable surfaces. The institution
  publishes no OAuth 2.0 authorization server and therefore defines no OAuth scopes. What it does
  operate is a SAML attribute release policy through its Shibboleth IdP, which is the functional
  equivalent for the federated surfaces — and it is the only place where UdeM makes an
  access-control decision about a machine-readable identity.
oauth2:
  present: false
  detail: >-
    No authorization server, no token endpoint, no .well-known/oauth-authorization-server and no
    .well-known/openid-configuration were found on any umontreal.ca host. No scope vocabulary
    exists to record.
scopes: []
alternative_authorization:
- mechanism: SAML attribute release
  x-operator: institution
  surface: https://shibboleth.umontreal.ca/idp/shibboleth
  detail: >-
    The IdP declares an AttributeAuthorityDescriptor supporting SAML 1.1, meaning attribute
    queries are answered out of band as well as in the assertion. The scope asserted for released
    attributes is shibmd:Scope "umontreal.ca" — a service provider must reject any scoped
    attribute value from this IdP that does not carry that domain. The attribute release policy
    itself is not public; it is negotiated per service provider through the federation.
  evidence:
    url: https://shibboleth.umontreal.ca/idp/shibboleth
    status: 200
- mechanism: SADVR consent flags
  x-operator: institution
  surface: https://www.recherche.umontreal.ca/vitrine/rest/api/1.8/umontreal/info/individu
  detail: >-
    Not an authorization mechanism in the technical sense, but it is the only access constraint
    the SADVR API expresses. Each full individual record carries a `consentement` object naming
    the UdeM showcases the person agreed to appear in ("Vitrine de la recherche", "Répertoire des
    experts à l'intention des médias") with a `statutConsentement` flag, and an `affichageWeb`
    block giving the URLs where that consent applies. Each affiliation also carries `exclusion`
    and `exclusionTel` flags. The API returns the data regardless; honouring the flags is left
    entirely to the consumer.
  evidence:
    url: https://www.recherche.umontreal.ca/vitrine/rest/api/1.8/umontreal/info/individu?idsadvr=in13593
    status: 200
- mechanism: Dataverse API token
  x-operator: tenant
  surface: https://borealisdata.ca/api
  detail: >-
    Borealis issues per-account Dataverse API tokens with permissions derived from the Dataverse
    role model, not from a scope string. UdeM does not define or issue these.
