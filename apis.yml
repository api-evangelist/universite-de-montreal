apis:
- aid: universite-de-montreal:sadvr
  name: SADVR REST API (Vitrine-Recherche)
  description: >-
    REST API from the Service d'accès aux données de la Vitrine-Recherche, redistributing UdeM research
    data. Provides five JSON services: resource value exposure (faculties, departments, functions, programs,
    study domains, research expertise, languages, unit types), persistent identifier search for individuals
    and research units, extended identifier search, full data retrieval by persistent identifier, and
    a SOLR-backed search engine service. The documented base path is a testing/legacy endpoint and may
    not currently resolve.
  humanURL: >-
    https://wiki.umontreal.ca/spaces/DOC/pages/294781211/API+REST+%E2%80%93+Description+technique
  tags:
