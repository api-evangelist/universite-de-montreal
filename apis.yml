aid: universite-de-montreal
name: Université de Montréal
x-type: university
x-category: Public Research University
description: >-
  Université de Montréal (UdeM) is Québec's largest French-language public research university and,
  with its two affiliated schools, the second-largest research complex in Canada. Its programmable
  footprint is small, real, and almost entirely research-facing — and it is important to say plainly
  what UdeM does and does not operate, because this profile previously claimed 36 APIs it does not
  have.

  UdeM genuinely operates two machine-readable surfaces. The first is the SADVR REST API
  (Service d'accès aux données de la Vitrine-Recherche), built in-house by the Centre d'expertise
  numérique pour la recherche and serving UdeM's faculties, departments, job titles, programmes,
  disciplines, research-expertise keywords and its own persistent identifiers (idsadvr) for 3,516
  indexed researchers and 429 research units — read-only, keyless, French-first, documented on the
  institution's own wiki, and confirmed live on 2026-08-30. The second is UdeM's Shibboleth Identity
  Provider, which publishes SAML 2.0 entity metadata under the institution's own domain; it is
  institution-operated by definition and is the kind of surface this cohort systematically fails to
  catalogue.

  Everything else in UdeM's footprint is a tenancy. PAPYRUS, the institutional repository, moved to
  Scholaris, the CRKN-hosted national DSpace service, so its OAI-PMH and DSpace REST contracts are
  DSpace's. UdeM's research data lives in a collection on Borealis, the shared Canadian Dataverse
  operated by Scholars Portal, so that contract is Dataverse's. Library discovery runs on OCLC
  WorldCat, and the LMS is Moodle. The data in all four is UdeM's; the engineering is not.

  There is no central developer portal, no self-service credential, no OAuth authorization server
  and no published status page. api.umontreal.ca resolves and answers, but returns HTTP 400 with an
  empty body on every anonymous path and is documented nowhere — an internal gateway, not a public
  API.
