- aid: universite-de-montreal:papyrus-oai
  name: Papyrus OAI-PMH Endpoint
  description: >-
    OAI-PMH 2.0 metadata harvesting endpoint for Papyrus, the UdeM institutional repository (a DSpace/Scholaris
    platform). Exposes open-access theses, dissertations, and scholarly output metadata for harvesting
    by service providers. Verified live returning a valid Identify response for "PAPYRUS - Dépôt institutionnel
    de l'Université de Montréal".
  humanURL: https://papyrus.bib.umontreal.ca/
  baseURL: https://umontreal.scholaris.ca/server/oai/openaire4
