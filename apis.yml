- aid: universite-de-montreal:shibboleth-idp
  name: UdeM Shibboleth Identity Provider (SAML metadata)
  x-operator: institution
  x-operator-evidence: >-
    entityID https://shibboleth.umontreal.ca/idp/shibboleth, served from the institution's own
    registrable domain, asserting shibmd:Scope "umontreal.ca". An identity provider is
    institution-operated by definition — it is the institution asserting who its people are.
  description: >-
    Université de Montréal's campus single sign-on, published as machine-readable SAML 2.0 entity
    metadata. The document declares an IDPSSODescriptor supporting SAML 2.0, SAML 1.1 and the legacy
    urn:mace:shibboleth:1.0 AuthnRequest profile, an AttributeAuthorityDescriptor for out-of-band
    attribute queries, SSO and SLO endpoints over HTTP-POST, HTTP-POST-SimpleSign, HTTP-Redirect and
    SOAP, artifact resolution on port 8443, and mdui display names in French and English. This is
    not an API a developer calls; it is the contract a relying party consumes to federate with UdeM,
    and it is machine-readable, versioned by publication, and permanently public.
