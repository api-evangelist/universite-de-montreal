- aid: universite-de-montreal:sadvr
  name: SADVR REST API (Vitrine-Recherche)
  x-operator: institution
  x-operator-evidence: >-
    Runs on recherche.umontreal.ca, Université de Montréal's own registrable domain. Built in-house
    by the institution's Centre d'expertise numérique pour la recherche under the SADVR project
    (2015-2016) and documented by UdeM staff on the institution's own Confluence wiki.
  description: >-
    Université de Montréal's own read-only research API, and the one genuinely institution-engineered
    contract in this profile. Five services: reference-value exposure (faculties, departments,
    administrative units, job titles, programmes, study domains, disciplines, research-expertise
    keywords, languages, research-unit types), persistent-identifier resolution for individuals and
    research units, an extended identifier service carrying affiliations and expertise, full record
    retrieval by idsadvr, and a SOLR-backed search across three showcases. No API key. GET only.
    Requests to the documented base are redirected into a /public/ path segment, so clients must
    follow redirects.

    The June 2026 profile of this repo recorded this API as a dead testing endpoint. That was wrong:
    the documented example URL uses `ressource/langues` where the deployment serves
    `ressource/langue`, and the undocumented HTML 404 read as a decommissioned service. Fifteen
    documented routes were re-probed on 2026-08-30 and returned 200 application/json.
