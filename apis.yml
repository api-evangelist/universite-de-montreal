x-coverage:
  state: covered
  reason: covered
  generated: '2026-08-30'
  method: probed
  detail: >-
    Université de Montréal operates two genuine institution-run machine-readable surfaces and four
    tenancies, and all six were probed live on 2026-08-30. The institution-operated SADVR research
    API answered on 15 of 17 documented routes with 200 application/json, and the Shibboleth IdP
    served valid SAML 2.0 entity metadata plus a live /idp/status report. The remaining four
    surfaces — PAPYRUS OAI-PMH, PAPYRUS DSpace REST, the Borealis Dataverse collection and WorldCat
    Discovery — all answered, and all four are vendor or consortium platforms running under UdeM's
    name; they are recorded as tenant relationships and their product contracts are deliberately not
    saved here.

    This profile is a correction, not an enrichment. It previously carried 36 OpenAPI documents and
    38 apis[] entries. All 36 were the Dataverse product's own contract, shipped by five to eight
    other institutions in this cohort, harvested from Borealis and then re-based by our own
    refine-openapis step onto umontreal.scholaris.ca — a DSpace host that does not serve the
    Dataverse API at all. Those 36 specs and the 88 artifacts derived from them were removed
    file-by-file. The apparent footprint drops from 38 entries to 6; the measured footprint rises,
    because the one API UdeM actually built was recorded as dead and is not.

    Not found, after probing: no developer portal, no open-data portal at data. or donnees., no
    documented course-catalog or registrar API, no OAuth authorization server, no status page, no
    llms.txt, no ORCID cross-walk in SADVR. api.umontreal.ca resolves and answers HTTP 400 with an
    empty body on every anonymous path and is named in no documentation — an internal gateway,
    recorded as evidence rather than as an API.
  evidence:
